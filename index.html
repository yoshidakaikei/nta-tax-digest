<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>税務ニュース週次まとめ</title>
<style>
  body{font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#f6f7f9;color:#1c2733;margin:0;line-height:1.75}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:1.5rem;margin:0 0 8px}
  .lede{color:#5b6b7a;font-size:.92rem;margin:0 0 16px}
  .badge{display:inline-block;font-size:.8rem;background:#eef2f6;color:#1c3d5a;padding:6px 12px;border-radius:999px;font-weight:600}
  .empty{background:#fff;border:1px dashed #d8dee4;border-radius:12px;padding:20px;color:#5b6b7a;font-size:.9rem;text-align:center;margin-top:20px}
  footer{margin-top:28px;padding-top:16px;border-top:1px solid #e4e9ee;font-size:.76rem;color:#5b6b7a}
</style>
</head>
<body>
<div class="wrap">
  <h1>相続税・法人税アップデート</h1>
  <p class="lede">国税庁ホーユページの新着情報を毎週金曜日に自動でまとめます。</p>
  <span class="badge">初回セットアップ中 — 次回配信で更新されます</span>
  <div class="empty">まだ配信データがありません。次回の自動更新をお待ちください。</div>
  <footer>情報源: 国税庁ホームページ「新着情報」(nta.go.jp)</footer>
</div>
</body>
</html>
